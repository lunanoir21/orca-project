# Orca clippy configuration. The zero-warnings policy is enforced on the command
# line with `cargo clippy --workspace -- -D warnings`; this file tunes specific
# lints. MSRV keeps suggestions compatible with the pinned minimum Rust version.

msrv = "1.85.0"

# Flag any `dbg!` left in committed code.
allow-dbg-in-tests = false

# Encourage small, clear functions; the GUI may exceed this and opt out locally.
too-many-arguments-threshold = 8
